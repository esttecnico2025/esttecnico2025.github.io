name: OMR Vision Suite · Procesamiento R

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identificador del trabajo creado por Supabase"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omr-processing-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar directorios de trabajo
        shell: bash
        run: mkdir -p work/input work/output

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - name: Instalar dependencias del motor
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::mirt
            any::jsonlite

      - name: Recuperar entrada privada desde Supabase
        env:
          EDGE_FUNCTION_URL: ${{ secrets.OMR_EDGE_FUNCTION_URL }}
          OMR_WORKER_SECRET: ${{ secrets.OMR_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          test -n "$EDGE_FUNCTION_URL" || { echo "Falta el secreto OMR_EDGE_FUNCTION_URL"; exit 1; }
          test -n "$OMR_WORKER_SECRET" || { echo "Falta el secreto OMR_WORKER_SECRET"; exit 1; }
          mkdir -p work/input work/output
          curl --fail-with-body --silent --show-error \
            -X POST "$EDGE_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $OMR_WORKER_SECRET" \
            --data "{\"action\":\"worker-get\",\"job_id\":\"$JOB_ID\"}" \
            -o work/job.json
          python scripts/prepare_job.py work/job.json work/input

      - name: Ejecutar motor R seleccionado en OMR Vision Suite
        shell: bash
        run: Rscript motor-r/motor_principal.R work/input work/output

      - name: Preparar resultados estructurados
        shell: bash
        run: python scripts/parse_results.py work/output

      - name: Guardar resultados y auditoría en Supabase
        env:
          EDGE_FUNCTION_URL: ${{ secrets.OMR_EDGE_FUNCTION_URL }}
          OMR_WORKER_SECRET: ${{ secrets.OMR_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('work/result_payload.json').read_text(encoding='utf-8'))
          p['job_id']=__import__('os').environ['JOB_ID']
          Path('work/complete.json').write_text(json.dumps({'action':'worker-complete','job_id':p['job_id'],'result_payload':{k:v for k,v in p.items() if k!='job_id'}},ensure_ascii=False),encoding='utf-8')
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "$EDGE_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $OMR_WORKER_SECRET" \
            --data-binary @work/complete.json

      - name: Marcar el trabajo como fallido si algún paso anterior falla
        if: failure()
        env:
          EDGE_FUNCTION_URL: ${{ secrets.OMR_EDGE_FUNCTION_URL }}
          OMR_WORKER_SECRET: ${{ secrets.OMR_WORKER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          mkdir -p work
          if [ -n "$EDGE_FUNCTION_URL" ] && [ -n "$OMR_WORKER_SECRET" ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          Path('work/fail.json').write_text(json.dumps({'action':'worker-fail','job_id':os.environ['JOB_ID'],'error_message':'El workflow de GitHub Actions falló. Abre la ejecución correspondiente para consultar el paso y el registro técnico.'}),encoding='utf-8')
          PY
            curl --silent --show-error -X POST "$EDGE_FUNCTION_URL" \
              -H "Content-Type: application/json" -H "x-worker-secret: $OMR_WORKER_SECRET" \
              --data-binary @work/fail.json || true
          fi

      - name: Conservar CSV de resultados y auditoría como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omr-r-${{ inputs.job_id }}
          path: work/output/
          if-no-files-found: ignore
          retention-days: 14
